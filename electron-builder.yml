# Build the Windows installer with:  npm run dist
# (run it ON Windows for a fully branded .exe: it edits the app's icon and version info)
appId: com.hoopstracker.app
productName: Hoops Tracker
copyright: Copyright © 2026 Hoops Tracker

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
electronLanguages: [en-US]   # drop the other 50 locale files: smaller download
publish: null                # no auto-update server configured

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: Hoops-Tracker-Setup-${version}.exe
  oneClick: false                           # let people see the options
  perMachine: false                         # per-user install: no administrator password needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Hoops Tracker
  deleteAppDataOnUninstall: false           # NEVER delete saved games when uninstalling
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

portable:
  artifactName: Hoops-Tracker-Portable-${version}.exe
